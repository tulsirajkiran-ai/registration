<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:700px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

table{
    width:100%;
    border-spacing:12px;
}

td:first-child{
    width:35%;
    font-weight:bold;
    color:#333;
}

input[type=text],
input[type=email],
input[type=password],
input[type=tel],
input[type=date],
input[type=file],
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border:1px solid #3498db;
    outline:none;
    box-shadow:0 0 6px rgba(52,152,219,.5);
}

input[type=radio],
input[type=checkbox]{
    margin-right:5px;
}

textarea{
    resize:none;
}

.button{
    text-align:center;
}

input[type=submit]{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    margin-right:10px;
}

input[type=submit]:hover{
    background:#218838;
}

input[type=reset]{
    background:#dc3545;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

input[type=reset]:hover{
    background:#c82333;
}

@media(max-width:768px){

.container{
    width:100%;
}

table,
tr,
td{
    display:block;
    width:100%;
}

td{
    margin-bottom:8px;
}

}
</style>

</head>

<body>

<div class="container">

<h1>Student Registration Form</h1>

<form>

<table>

<tr>
<td>Roll Number</td>
<td><input type="text" placeholder="Enter Roll Number" required></td>
</tr>

<tr>
<td>First Name</td>
<td><input type="text" placeholder="Enter First Name" required></td>
</tr>

<tr>
<td>Last Name</td>
<td><input type="text" placeholder="Enter Last Name" required></td>
</tr>

<tr>
<td>Father's Name</td>
<td><input type="text" placeholder="Enter Father's Name" required></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date" required></td>
</tr>

<tr>
<td>Mobile Number</td>
<td><input type="tel" placeholder="+91 9876543210" required></td>
</tr>

<tr>
<td>Email Address</td>
<td><input type="email" placeholder="Enter Email Address" required></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password" placeholder="Enter Password" required></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
&nbsp;&nbsp;
<input type="radio" name="gender"> Female
&nbsp;&nbsp;
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td>Department</td>
<td>
<input type="checkbox"> CSE
<input type="checkbox"> IT
<input type="checkbox"> ECE
<input type="checkbox"> Civil
<input type="checkbox"> Mechanical
</td>
</tr>

<tr>
<td>Course</td>
<td>
<select required>
<option value="">-- Select Course --</option>
<option>B.Tech</option>
<option>M.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>B.Sc</option>
<option>M.Sc</option>
</select>
</td>
</tr>

<tr>
<td>Student Photo</td>
<td><input type="file"></td>
</tr>

<tr>
<td>City</td>
<td><input type="text" placeholder="Enter City"></td>
</tr>

<tr>
<td>Address</td>
<td>
<textarea rows="4" placeholder="Enter Address"></textarea>
</td>
</tr>

<tr>
<td colspan="2" class="button">
<input type="submit" value="Register">
<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
